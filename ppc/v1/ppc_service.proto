syntax = "proto3";

package ppc.v1;

import "google/api/annotations.proto";
import "ppc/v1/changeover.proto";
import "ppc/v1/customer.proto";
import "ppc/v1/daily_performance.proto";
import "ppc/v1/dashboard.proto";
import "ppc/v1/demand.proto";
import "ppc/v1/master.proto";
import "ppc/v1/packing.proto";
import "ppc/v1/plan_item.proto";
import "ppc/v1/work_order.proto";

// =============================================================================
// PPCService aggregates all Production Planning & Control RPCs.
// REST is exposed via grpc-gateway under /api/v1/ppc/*.
// =============================================================================

service PPCService {
  // ── Masters: MachineGroup ──────────────────────────────────────────────────
  // CreateMachineGroup creates a machine group.
  rpc CreateMachineGroup(CreateMachineGroupRequest) returns (CreateMachineGroupResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/machine-groups"
      body: "*"
    };
  }
  // GetMachineGroup gets a machine group by id.
  rpc GetMachineGroup(GetMachineGroupRequest) returns (GetMachineGroupResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/machine-groups/{group_id}"};
  }
  // UpdateMachineGroup updates a machine group.
  rpc UpdateMachineGroup(UpdateMachineGroupRequest) returns (UpdateMachineGroupResponse) {
    option (google.api.http) = {
      put: "/api/v1/ppc/machine-groups/{group_id}"
      body: "*"
    };
  }
  // DeleteMachineGroup soft-deletes a machine group.
  rpc DeleteMachineGroup(DeleteMachineGroupRequest) returns (DeleteMachineGroupResponse) {
    option (google.api.http) = {delete: "/api/v1/ppc/machine-groups/{group_id}"};
  }
  // ListMachineGroups lists machine groups.
  rpc ListMachineGroups(ListMachineGroupsRequest) returns (ListMachineGroupsResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/machine-groups"};
  }

  // ── Masters: Machine (sync-sourced) ────────────────────────────────────────
  // CreateMachine hand-adds a machine (rare; normal flow is SyncMachines).
  rpc CreateMachine(CreateMachineRequest) returns (CreateMachineResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/machines"
      body: "*"
    };
  }
  // GetMachine gets a machine by id.
  rpc GetMachine(GetMachineRequest) returns (GetMachineResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/machines/{machine_id}"};
  }
  // UpdateMachine edits PPC-only machine fields (preserved across syncs).
  rpc UpdateMachine(UpdateMachineRequest) returns (UpdateMachineResponse) {
    option (google.api.http) = {
      put: "/api/v1/ppc/machines/{machine_id}"
      body: "*"
    };
  }
  // ListMachines lists machines.
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/machines"};
  }
  // SyncMachines triggers an on-demand machine sync from finance + Oracle.
  rpc SyncMachines(SyncMachinesRequest) returns (SyncMachinesResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/machines/sync"
      body: "*"
    };
  }

  // ── Masters: Customer (sync-sourced from Oracle OM_CUSTOMER) ───────────────
  // CreateCustomer hand-adds a customer (marked MANUAL; sync never overwrites it).
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/customers"
      body: "*"
    };
  }
  // GetCustomer gets a customer by id.
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/customers/{customer_id}"};
  }
  // UpdateCustomer edits a customer; the code is immutable.
  rpc UpdateCustomer(UpdateCustomerRequest) returns (UpdateCustomerResponse) {
    option (google.api.http) = {
      put: "/api/v1/ppc/customers/{customer_id}"
      body: "*"
    };
  }
  // ListCustomers lists customers.
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/customers"};
  }
  // SyncCustomers triggers an on-demand read-only sync from Oracle OM_CUSTOMER.
  rpc SyncCustomers(SyncCustomersRequest) returns (SyncCustomersResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/customers/sync"
      body: "*"
    };
  }
  // ExportCustomers exports the customer master to an Excel workbook.
  rpc ExportCustomers(ExportCustomersRequest) returns (ExportCustomersResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/customers/export"};
  }
  // ImportCustomers bulk-creates or updates customers from an Excel workbook.
  rpc ImportCustomers(ImportCustomersRequest) returns (ImportCustomersResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/customers/import"
      body: "*"
    };
  }
  // DownloadCustomerTemplate returns the customer import template workbook.
  rpc DownloadCustomerTemplate(DownloadCustomerTemplateRequest) returns (DownloadCustomerTemplateResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/customers/template"};
  }

  // ── Masters: LotMaster ─────────────────────────────────────────────────────
  // CreateLotMaster creates a lot master.
  rpc CreateLotMaster(CreateLotMasterRequest) returns (CreateLotMasterResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/lots"
      body: "*"
    };
  }
  // GetLotMaster gets a lot master by lot number.
  rpc GetLotMaster(GetLotMasterRequest) returns (GetLotMasterResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/lots/{lot_no}"};
  }
  // UpdateLotMaster updates a lot master.
  rpc UpdateLotMaster(UpdateLotMasterRequest) returns (UpdateLotMasterResponse) {
    option (google.api.http) = {
      put: "/api/v1/ppc/lots/{lot_no}"
      body: "*"
    };
  }
  // DeleteLotMaster soft-deletes a lot master.
  rpc DeleteLotMaster(DeleteLotMasterRequest) returns (DeleteLotMasterResponse) {
    option (google.api.http) = {delete: "/api/v1/ppc/lots/{lot_no}"};
  }
  // ListLotMasters lists lot masters.
  rpc ListLotMasters(ListLotMastersRequest) returns (ListLotMastersResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/lots"};
  }
  // SyncLots triggers an on-demand read-only import from Oracle ASPAK.MMSMERGE.
  rpc SyncLots(SyncLotsRequest) returns (SyncLotsResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/lots/sync"
      body: "*"
    };
  }

  // ── Masters: ProductPPCConfig ──────────────────────────────────────────────
  // CreateProductPPCConfig creates a product PPC config.
  rpc CreateProductPPCConfig(CreateProductPPCConfigRequest) returns (CreateProductPPCConfigResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/product-configs"
      body: "*"
    };
  }
  // GetProductPPCConfig gets a product PPC config by id.
  rpc GetProductPPCConfig(GetProductPPCConfigRequest) returns (GetProductPPCConfigResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/product-configs/{config_id}"};
  }
  // UpdateProductPPCConfig updates a product PPC config.
  rpc UpdateProductPPCConfig(UpdateProductPPCConfigRequest) returns (UpdateProductPPCConfigResponse) {
    option (google.api.http) = {
      put: "/api/v1/ppc/product-configs/{config_id}"
      body: "*"
    };
  }
  // DeleteProductPPCConfig soft-deletes a product PPC config.
  rpc DeleteProductPPCConfig(DeleteProductPPCConfigRequest) returns (DeleteProductPPCConfigResponse) {
    option (google.api.http) = {delete: "/api/v1/ppc/product-configs/{config_id}"};
  }
  // ListProductPPCConfigs lists product PPC configs.
  rpc ListProductPPCConfigs(ListProductPPCConfigsRequest) returns (ListProductPPCConfigsResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/product-configs"};
  }

  // ── Masters: ProductMachineCapacity ────────────────────────────────────────
  // CreateProductMachineCapacity creates a product-machine capacity row.
  rpc CreateProductMachineCapacity(CreateProductMachineCapacityRequest) returns (CreateProductMachineCapacityResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/machine-capacities"
      body: "*"
    };
  }
  // GetProductMachineCapacity gets a product-machine capacity by id.
  rpc GetProductMachineCapacity(GetProductMachineCapacityRequest) returns (GetProductMachineCapacityResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/machine-capacities/{capacity_id}"};
  }
  // UpdateProductMachineCapacity updates a product-machine capacity.
  rpc UpdateProductMachineCapacity(UpdateProductMachineCapacityRequest) returns (UpdateProductMachineCapacityResponse) {
    option (google.api.http) = {
      put: "/api/v1/ppc/machine-capacities/{capacity_id}"
      body: "*"
    };
  }
  // DeleteProductMachineCapacity soft-deletes a product-machine capacity.
  rpc DeleteProductMachineCapacity(DeleteProductMachineCapacityRequest) returns (DeleteProductMachineCapacityResponse) {
    option (google.api.http) = {delete: "/api/v1/ppc/machine-capacities/{capacity_id}"};
  }
  // ListProductMachineCapacities lists product-machine capacities.
  rpc ListProductMachineCapacities(ListProductMachineCapacitiesRequest) returns (ListProductMachineCapacitiesResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/machine-capacities"};
  }

  // ── Masters: ProductMachineParameter (v1.2) ────────────────────────────────
  // CreateProductMachineParameter creates a per-product+machine param value.
  rpc CreateProductMachineParameter(CreateProductMachineParameterRequest) returns (CreateProductMachineParameterResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/machine-parameters"
      body: "*"
    };
  }
  // GetProductMachineParameter gets a per-product+machine param value by id.
  rpc GetProductMachineParameter(GetProductMachineParameterRequest) returns (GetProductMachineParameterResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/machine-parameters/{pmp_id}"};
  }
  // UpdateProductMachineParameter updates a per-product+machine param value.
  rpc UpdateProductMachineParameter(UpdateProductMachineParameterRequest) returns (UpdateProductMachineParameterResponse) {
    option (google.api.http) = {
      put: "/api/v1/ppc/machine-parameters/{pmp_id}"
      body: "*"
    };
  }
  // DeleteProductMachineParameter soft-deletes a per-product+machine param value.
  rpc DeleteProductMachineParameter(DeleteProductMachineParameterRequest) returns (DeleteProductMachineParameterResponse) {
    option (google.api.http) = {delete: "/api/v1/ppc/machine-parameters/{pmp_id}"};
  }
  // ListProductMachineParameters lists per-product+machine param values.
  rpc ListProductMachineParameters(ListProductMachineParametersRequest) returns (ListProductMachineParametersResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/machine-parameters"};
  }

  // ── Masters: OverrunThresholdConfig ────────────────────────────────────────
  // CreateOverrunThresholdConfig creates an over-production threshold.
  rpc CreateOverrunThresholdConfig(CreateOverrunThresholdConfigRequest) returns (CreateOverrunThresholdConfigResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/overrun-thresholds"
      body: "*"
    };
  }
  // GetOverrunThresholdConfig gets an over-production threshold by id.
  rpc GetOverrunThresholdConfig(GetOverrunThresholdConfigRequest) returns (GetOverrunThresholdConfigResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/overrun-thresholds/{threshold_id}"};
  }
  // UpdateOverrunThresholdConfig updates an over-production threshold.
  rpc UpdateOverrunThresholdConfig(UpdateOverrunThresholdConfigRequest) returns (UpdateOverrunThresholdConfigResponse) {
    option (google.api.http) = {
      put: "/api/v1/ppc/overrun-thresholds/{threshold_id}"
      body: "*"
    };
  }
  // DeleteOverrunThresholdConfig soft-deletes an over-production threshold.
  rpc DeleteOverrunThresholdConfig(DeleteOverrunThresholdConfigRequest) returns (DeleteOverrunThresholdConfigResponse) {
    option (google.api.http) = {delete: "/api/v1/ppc/overrun-thresholds/{threshold_id}"};
  }
  // ListOverrunThresholdConfigs lists over-production thresholds.
  rpc ListOverrunThresholdConfigs(ListOverrunThresholdConfigsRequest) returns (ListOverrunThresholdConfigsResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/overrun-thresholds"};
  }

  // ── Masters: DowntimeReasonMaster ──────────────────────────────────────────
  // CreateDowntimeReasonMaster creates a downtime reason.
  rpc CreateDowntimeReasonMaster(CreateDowntimeReasonMasterRequest) returns (CreateDowntimeReasonMasterResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/downtime-reasons"
      body: "*"
    };
  }
  // GetDowntimeReasonMaster gets a downtime reason by id.
  rpc GetDowntimeReasonMaster(GetDowntimeReasonMasterRequest) returns (GetDowntimeReasonMasterResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/downtime-reasons/{reason_id}"};
  }
  // UpdateDowntimeReasonMaster updates a downtime reason.
  rpc UpdateDowntimeReasonMaster(UpdateDowntimeReasonMasterRequest) returns (UpdateDowntimeReasonMasterResponse) {
    option (google.api.http) = {
      put: "/api/v1/ppc/downtime-reasons/{reason_id}"
      body: "*"
    };
  }
  // DeleteDowntimeReasonMaster soft-deletes a downtime reason.
  rpc DeleteDowntimeReasonMaster(DeleteDowntimeReasonMasterRequest) returns (DeleteDowntimeReasonMasterResponse) {
    option (google.api.http) = {delete: "/api/v1/ppc/downtime-reasons/{reason_id}"};
  }
  // ListDowntimeReasonMasters lists downtime reasons.
  rpc ListDowntimeReasonMasters(ListDowntimeReasonMastersRequest) returns (ListDowntimeReasonMastersResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/downtime-reasons"};
  }

  // ── Masters: WasteCategoryMaster ───────────────────────────────────────────
  // CreateWasteCategoryMaster creates a waste category.
  rpc CreateWasteCategoryMaster(CreateWasteCategoryMasterRequest) returns (CreateWasteCategoryMasterResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/waste-categories"
      body: "*"
    };
  }
  // GetWasteCategoryMaster gets a waste category by id.
  rpc GetWasteCategoryMaster(GetWasteCategoryMasterRequest) returns (GetWasteCategoryMasterResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/waste-categories/{category_id}"};
  }
  // UpdateWasteCategoryMaster updates a waste category.
  rpc UpdateWasteCategoryMaster(UpdateWasteCategoryMasterRequest) returns (UpdateWasteCategoryMasterResponse) {
    option (google.api.http) = {
      put: "/api/v1/ppc/waste-categories/{category_id}"
      body: "*"
    };
  }
  // DeleteWasteCategoryMaster soft-deletes a waste category.
  rpc DeleteWasteCategoryMaster(DeleteWasteCategoryMasterRequest) returns (DeleteWasteCategoryMasterResponse) {
    option (google.api.http) = {delete: "/api/v1/ppc/waste-categories/{category_id}"};
  }
  // ListWasteCategoryMasters lists waste categories.
  rpc ListWasteCategoryMasters(ListWasteCategoryMastersRequest) returns (ListWasteCategoryMastersResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/waste-categories"};
  }

  // ── Layer 1: Demand + Sales Order staging ──────────────────────────────────
  // ListSalesOrderStaging lists the ETL SO inbox (LOV source).
  rpc ListSalesOrderStaging(ListSalesOrderStagingRequest) returns (ListSalesOrderStagingResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/sales-order-staging"};
  }
  // ListSalesOrderStagingIds returns the ids of every staging row matching a
  // filter (capped), backing the LOV's "select all matching" action.
  rpc ListSalesOrderStagingIds(ListSalesOrderStagingIdsRequest) returns (ListSalesOrderStagingIdsResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/sales-order-staging/ids"};
  }
  // SetStagingProduct persists a manual product pick on a staging row.
  rpc SetStagingProduct(SetStagingProductRequest) returns (SetStagingProductResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/sales-order-staging/{sos_id}/product"
      body: "*"
    };
  }
  // CreateDemand creates a demand.
  rpc CreateDemand(CreateDemandRequest) returns (CreateDemandResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/demands"
      body: "*"
    };
  }
  // GetDemand gets a demand by id.
  rpc GetDemand(GetDemandRequest) returns (GetDemandResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/demands/{demand_id}"};
  }
  // UpdateDemand updates a demand.
  rpc UpdateDemand(UpdateDemandRequest) returns (UpdateDemandResponse) {
    option (google.api.http) = {
      put: "/api/v1/ppc/demands/{demand_id}"
      body: "*"
    };
  }
  // MapDemandProduct maps a product onto a demand that currently has none.
  // Rejected if the demand is already mapped to a product.
  rpc MapDemandProduct(MapDemandProductRequest) returns (MapDemandProductResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/demands/{demand_id}/map-product"
      body: "*"
    };
  }
  // DeleteDemand soft-deletes a demand.
  rpc DeleteDemand(DeleteDemandRequest) returns (DeleteDemandResponse) {
    option (google.api.http) = {delete: "/api/v1/ppc/demands/{demand_id}"};
  }
  // ListDemands lists demands.
  rpc ListDemands(ListDemandsRequest) returns (ListDemandsResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/demands"};
  }
  // ConfirmDemand confirms a pending demand.
  rpc ConfirmDemand(ConfirmDemandRequest) returns (ConfirmDemandResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/demands/{demand_id}/confirm"
      body: "*"
    };
  }
  // PullFromOrion creates demands from selected SO staging rows.
  rpc PullFromOrion(PullFromOrionRequest) returns (PullFromOrionResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/demands/pull-from-orion"
      body: "*"
    };
  }
  // ListCarryForwardCandidates lists demands eligible for carry-forward.
  rpc ListCarryForwardCandidates(ListCarryForwardCandidatesRequest) returns (ListCarryForwardCandidatesResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/demands/carry-forward-candidates"};
  }
  // ProcessCarryForward executes a per-demand carry-forward action.
  rpc ProcessCarryForward(ProcessCarryForwardRequest) returns (ProcessCarryForwardResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/demands/{source_demand_id}/carry-forward"
      body: "*"
    };
  }
  // ApproveMTSDemand records the Marketing MTS approval decision.
  rpc ApproveMTSDemand(ApproveMTSDemandRequest) returns (ApproveMTSDemandResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/demands/{demand_id}/approve-mts"
      body: "*"
    };
  }

  // ── Layer 2: Plan Item + Gantt ─────────────────────────────────────────────
  // CreatePlanItem creates a plan item.
  rpc CreatePlanItem(CreatePlanItemRequest) returns (CreatePlanItemResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/plan-items"
      body: "*"
    };
  }
  // GetPlanItem gets a plan item by id.
  rpc GetPlanItem(GetPlanItemRequest) returns (GetPlanItemResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/plan-items/{plan_item_id}"};
  }
  // UpdatePlanItem updates a plan item.
  rpc UpdatePlanItem(UpdatePlanItemRequest) returns (UpdatePlanItemResponse) {
    option (google.api.http) = {
      put: "/api/v1/ppc/plan-items/{plan_item_id}"
      body: "*"
    };
  }
  // DeletePlanItem soft-deletes a plan item.
  rpc DeletePlanItem(DeletePlanItemRequest) returns (DeletePlanItemResponse) {
    option (google.api.http) = {delete: "/api/v1/ppc/plan-items/{plan_item_id}"};
  }
  // ListPlanItems lists plan items.
  rpc ListPlanItems(ListPlanItemsRequest) returns (ListPlanItemsResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/plan-items"};
  }
  // GetGanttView returns scheduled bars for the plan timeline.
  rpc GetGanttView(GetGanttViewRequest) returns (GetGanttViewResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/plan-items/gantt"};
  }
  // ListPlanCarryForwardCandidates lists plan items eligible for carry-forward.
  rpc ListPlanCarryForwardCandidates(ListPlanCarryForwardCandidatesRequest) returns (ListPlanCarryForwardCandidatesResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/plan-items/carry-forward-candidates"};
  }
  // ProcessPlanCarryForward executes a per-plan-item carry-forward action.
  rpc ProcessPlanCarryForward(ProcessPlanCarryForwardRequest) returns (ProcessPlanCarryForwardResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/plan-items/{source_plan_item_id}/carry-forward"
      body: "*"
    };
  }

  // ── Work Order Carry-forward (month start) ──────────────────────────────────
  // ListWorkOrderCarryForwardCandidates lists WOs eligible to carry into a new
  // month. Ineligible WOs are included with their reason, never silently filtered.
  rpc ListWorkOrderCarryForwardCandidates(ListWorkOrderCarryForwardCandidatesRequest) returns (ListWorkOrderCarryForwardCandidatesResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/work-orders/carry-forward-candidates"};
  }
  // ProcessWorkOrderCarryForward carries one WO into a new month as a CONTINUATION.
  rpc ProcessWorkOrderCarryForward(ProcessWorkOrderCarryForwardRequest) returns (ProcessWorkOrderCarryForwardResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/work-orders/{source_wo_id}/carry-forward"
      body: "*"
    };
  }

  // ── Layer 3: Work Order ────────────────────────────────────────────────────
  // CreateWorkOrder creates a work order.
  rpc CreateWorkOrder(CreateWorkOrderRequest) returns (CreateWorkOrderResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/work-orders"
      body: "*"
    };
  }
  // GetWorkOrder gets a work order by id.
  rpc GetWorkOrder(GetWorkOrderRequest) returns (GetWorkOrderResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/work-orders/{wo_id}"};
  }
  // UpdateWorkOrder updates a work order.
  rpc UpdateWorkOrder(UpdateWorkOrderRequest) returns (UpdateWorkOrderResponse) {
    option (google.api.http) = {
      put: "/api/v1/ppc/work-orders/{wo_id}"
      body: "*"
    };
  }
  // DeleteWorkOrder soft-deletes a work order.
  rpc DeleteWorkOrder(DeleteWorkOrderRequest) returns (DeleteWorkOrderResponse) {
    option (google.api.http) = {delete: "/api/v1/ppc/work-orders/{wo_id}"};
  }
  // ListWorkOrders lists work orders.
  rpc ListWorkOrders(ListWorkOrdersRequest) returns (ListWorkOrdersResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/work-orders"};
  }
  // ListMergeCandidates lists plan items mergeable into one WO with an anchor.
  rpc ListMergeCandidates(ListMergeCandidatesRequest) returns (ListMergeCandidatesResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/work-orders/merge-candidates"};
  }
  // ResolveWOParameters previews the resolved parameter chain for product+machine.
  rpc ResolveWOParameters(ResolveWOParametersRequest) returns (ResolveWOParametersResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/work-orders/resolve-parameters"
      body: "*"
    };
  }
  // SaveWOParameters upserts the planned PPC parameter values for a WO.
  rpc SaveWOParameters(SaveWOParametersRequest) returns (SaveWOParametersResponse) {
    option (google.api.http) = {
      put: "/api/v1/ppc/work-orders/{wo_id}/parameters"
      body: "*"
    };
  }
  // SaveWORmAllocations replaces the RM allocation lines for a WO.
  rpc SaveWORmAllocations(SaveWORmAllocationsRequest) returns (SaveWORmAllocationsResponse) {
    option (google.api.http) = {
      put: "/api/v1/ppc/work-orders/{wo_id}/rm-allocations"
      body: "*"
    };
  }
  // PopulateWORmFromRoute auto-materializes RM allocation suggestions from the WO's route.
  rpc PopulateWORmFromRoute(PopulateWORmFromRouteRequest) returns (PopulateWORmFromRouteResponse) {
    option (google.api.http) = {
      post: "/api/v1/ppc/work-orders/{wo_id}/rm-allocations/populate-from-route"
      body: "*"
    };
  }
  // SaveWOExecution upserts an actual parameter value for a date+shift+param.
  rpc SaveWOExecution(SaveWOExecutionRequest) returns (SaveWOExecutionResponse) {
    option (google.api.http) = {
      put: "/api/v1/ppc/work-orders/{wo_id}/executions"
      body: "*"
    };
  }
  // ListWOExecutions lists actual parameter values for a WO.
  rpc ListWOExecutions(ListWOExecutionsRequest) returns (ListWOExecutionsResponse) {
    option (google.api.http) = {get: "/api/v1/ppc/work-orders/{wo_id}/executions"};
  }
  // SubmitWO submits a WO for sequential PC->PM approval.
  rpc SubmitWO(SubmitWORequest) returns (SubmitWOResponse) {
    option (google.api.http) = {
