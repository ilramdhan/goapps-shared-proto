syntax = "proto3";

package ppc.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";
import "ppc/v1/common.proto";

// =============================================================================
// Packing & Grading (Phase 3) — grade-actual from packing (PPC_GRADE_ACTUAL ETL)
// and common-lot consolidation (combine leftover bobbins across shades into a
// new ERP identity). Decimals are decimal-as-string.
// =============================================================================

// WOGradeActual is one grade line of packing-done actuals for a work order,
// sourced from Oracle MGTDAT.PPC_GRADE_ACTUAL and matched by original lot.
// Grade hierarchy: AX/AE/A9/A/AM/APQ/B/BB/C/JLT.
message WOGradeActual {
  int64 grade_actual_id = 1;
  int64 wo_id = 2;
  string lot_no = 3; // original lot
  string grade = 4; // AX/AE/A9/A/AM/APQ/B/BB/C/JLT
  string dept = 5; // TXT / TWT
  string total_qty_kg = 6; // decimal-as-string
  int32 bobbin_count = 7;
  string last_packing_date = 8; // ISO-8601 date
  string synced_at = 9; // ISO-8601
}

// ListWOGradeActualsRequest lists grade-actual lines, optionally scoped to one
// work order, grade, or department.
message ListWOGradeActualsRequest {
  int32 page = 1 [(buf.validate.field).int32.gte = 1];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  optional int64 wo_id = 3;
  string grade = 4 [(buf.validate.field).string.max_len = 5];
  string dept = 5 [(buf.validate.field).string.max_len = 3];
  string sort_by = 6 [(buf.validate.field).string = {
    in: [
      "",
      "grade",
      "lot_no",
      "last_packing_date"
    ]
  }];
  string sort_order = 7 [(buf.validate.field).string = {
    in: [
      "",
      "asc",
      "desc"
    ]
  }];
}

message ListWOGradeActualsResponse {
  common.v1.BaseResponse base = 1;
  repeated WOGradeActual data = 2;
  common.v1.PaginationResponse pagination = 3;
}

// ── Common lot ───────────────────────────────────────────────────────────────

// CommonLotComponent is one original lot folded into a common lot.
message CommonLotComponent {
  int64 component_id = 1;
  int64 common_lot_id = 2;
  string original_lot_no = 3;
  string original_shade_code = 4;
  int32 bobbin_count = 5;
  string qty_kg = 6; // decimal-as-string
}

// CommonLot is a consolidated ERP lot combining leftover bobbins from several
// original lots (potentially different shades) under a new ERP identity.
message CommonLot {
  int64 common_lot_id = 1;
  string lot_no = 2; // new ERP lot number (unique)
  string item_code = 3;
  string shade_code = 4;
  string erp_grade_code = 5;
  string created_at = 6; // ISO-8601
  repeated CommonLotComponent components = 7;
}

// CommonLotComponentInput is one component line supplied when creating a common
// lot.
message CommonLotComponentInput {
  string original_lot_no = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 30
  }];
  string original_shade_code = 2 [(buf.validate.field).string.max_len = 20];
  int32 bobbin_count = 3 [(buf.validate.field).int32.gte = 0];
  string qty_kg = 4 [(buf.validate.field).string.max_len = 20];
}

message CreateCommonLotRequest {
  string lot_no = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 30
  }];
  string item_code = 2 [(buf.validate.field).string.max_len = 30];
  string shade_code = 3 [(buf.validate.field).string.max_len = 20];
  string erp_grade_code = 4 [(buf.validate.field).string.max_len = 5];
  repeated CommonLotComponentInput components = 5 [(buf.validate.field).repeated.min_items = 1];
}

message CreateCommonLotResponse {
  common.v1.BaseResponse base = 1;
  CommonLot data = 2;
}

message GetCommonLotRequest {
  int64 common_lot_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetCommonLotResponse {
  common.v1.BaseResponse base = 1;
  CommonLot data = 2;
}

message ListCommonLotsRequest {
  int32 page = 1 [(buf.validate.field).int32.gte = 1];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  string search = 3 [(buf.validate.field).string.max_len = 100];
  string item_code = 4 [(buf.validate.field).string.max_len = 30];
  string sort_by = 5 [(buf.validate.field).string = {
    in: [
      "",
      "lot_no",
      "item_code",
      "created_at"
    ]
  }];
  string sort_order = 6 [(buf.validate.field).string = {
    in: [
      "",
      "asc",
      "desc"
    ]
  }];
}

message ListCommonLotsResponse {
  common.v1.BaseResponse base = 1;
  repeated CommonLot data = 2;
  common.v1.PaginationResponse pagination = 3;
}

// ── Excel export ─────────────────────────────────────────────────────────────

// ExportDailyPerformanceRequest exports the daily-performance efficiency
// snapshots for a date (all areas or one) to an .xlsx workbook.
message ExportDailyPerformanceRequest {
  string date = 1 [(buf.validate.field).string = {
    min_len: 8
    max_len: 10
  }];
  AreaCode area = 2; // UNSPECIFIED = all areas.
}

// ExportDailyPerformanceResponse carries the generated Excel workbook.
message ExportDailyPerformanceResponse {
  common.v1.BaseResponse base = 1;
  bytes file_content = 2; // .xlsx bytes
  string file_name = 3;
}
