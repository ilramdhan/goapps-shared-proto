// ── PpcLookup (display metadata) ─────────────────────────────────────────────

// PpcLookup is a lightweight, PPC-owned display-metadata row. It supplies the
// frontend with admin-configurable dropdown labels/order/active-state WITHOUT
// making business enums dynamic. Backend business logic keeps validating against
// Go enum constants; a code here MUST equal the enum string value it labels.
message PpcLookup {
  int64 lookup_id = 1;
  string category = 2; // e.g. PPC_AREA, PPC_DEMAND_TYPE
  string code = 3; // equals the enum string value (e.g. AX_ONLY)
  string label = 4; // human-friendly (e.g. "AX Only")
  int32 sort_order = 5;
  bool is_active = 6;
  common.v1.AuditInfo audit = 16;
}

message CreatePpcLookupRequest {
  string category = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 40
  }];
  string code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 40
  }];
  string label = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 120
  }];
  int32 sort_order = 4 [(buf.validate.field).int32.gte = 0];
}

message CreatePpcLookupResponse {
  common.v1.BaseResponse base = 1;
  PpcLookup data = 2;
}

message GetPpcLookupRequest {
  int64 lookup_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetPpcLookupResponse {
  common.v1.BaseResponse base = 1;
  PpcLookup data = 2;
}

message UpdatePpcLookupRequest {
  int64 lookup_id = 1 [(buf.validate.field).int64.gt = 0];
  optional string label = 2 [(buf.validate.field).string.max_len = 120];
  optional int32 sort_order = 3 [(buf.validate.field).int32.gte = 0];
  optional bool is_active = 4;
}

message UpdatePpcLookupResponse {
  common.v1.BaseResponse base = 1;
  PpcLookup data = 2;
}

message DeletePpcLookupRequest {
  int64 lookup_id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeletePpcLookupResponse {
  common.v1.BaseResponse base = 1;
}

message ListPpcLookupsRequest {
  int32 page = 1 [(buf.validate.field).int32.gte = 1];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 200
  }];
  string category = 3 [(buf.validate.field).string.max_len = 40]; // empty = all categories
  string search = 4 [(buf.validate.field).string.max_len = 100];
