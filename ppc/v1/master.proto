// ── ProductMachineParameter ──────────────────────────────────────────────────

// ProductMachineParameter is the per-PRODUCT+MACHINE parameter value layer
// (v1.2, Opt A). cost_product_parameter is per-product only; values that vary
// per machine (speed, positions, draw-ratio) live here, referencing the same
// mst_parameter definition (one definition, two grains). WO resolution chain:
// WO-ref -> this layer -> cost_product_parameter -> mst_parameter.default.
message ProductMachineParameter {
  int64 pmp_id = 1;
  int64 cpm_product_sys_id = 2; // soft ref (finance)
  int64 machine_id = 3;
  string machine_no = 4; // denormalized for UI
  string param_id = 5; // UUID, FK mst_parameter (Costing)
  string param_code = 6; // denormalized for UI
  string param_name = 7; // denormalized for UI
  string data_type = 8; // NUMBER / TEXT / BOOLEAN
  string value_num = 9; // decimal-as-string
  string value_text = 10;
  bool value_flag = 11;
  common.v1.AuditInfo audit = 16;
}

message CreateProductMachineParameterRequest {
  int64 cpm_product_sys_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 machine_id = 2 [(buf.validate.field).int64.gt = 0];
  string param_id = 3 [(buf.validate.field).string.uuid = true];
  string value_num = 4 [(buf.validate.field).string.max_len = 40]; // decimal-as-string
  string value_text = 5 [(buf.validate.field).string.max_len = 500];
  bool value_flag = 6;
  bool has_value_flag = 7;
}

message CreateProductMachineParameterResponse {
  common.v1.BaseResponse base = 1;
  ProductMachineParameter data = 2;
}

message GetProductMachineParameterRequest {
  int64 pmp_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetProductMachineParameterResponse {
  common.v1.BaseResponse base = 1;
  ProductMachineParameter data = 2;
}

message UpdateProductMachineParameterRequest {
  int64 pmp_id = 1 [(buf.validate.field).int64.gt = 0];
  optional string value_num = 2 [(buf.validate.field).string.max_len = 40];
  optional string value_text = 3 [(buf.validate.field).string.max_len = 500];
  optional bool value_flag = 4;
}

message UpdateProductMachineParameterResponse {
  common.v1.BaseResponse base = 1;
  ProductMachineParameter data = 2;
}

message DeleteProductMachineParameterRequest {
