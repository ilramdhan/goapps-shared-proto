// ── PpcShift ─────────────────────────────────────────────────────────────────

// PpcShift is the genuine shift master (per-row attributes). end_time may be
// earlier than start_time to model a shift crossing midnight. Times are HH:MM.
message PpcShift {
  int64 shift_id = 1;
  string code = 2; // 1 / 2 / 3
  string name = 3;
  string start_time = 4; // HH:MM
  string end_time = 5; // HH:MM
  bool is_active = 6;
  common.v1.AuditInfo audit = 16;
}

message CreatePpcShiftRequest {
  string code = 1 [(buf.validate.field).string = {
    len: 1
    pattern: "^[0-9]$"
  }];
  string name = 2 [(buf.validate.field).string.max_len = 40];
  string start_time = 3 [(buf.validate.field).string.pattern = "^([01][0-9]|2[0-3]):[0-5][0-9]$"];
  string end_time = 4 [(buf.validate.field).string.pattern = "^([01][0-9]|2[0-3]):[0-5][0-9]$"];
}

message CreatePpcShiftResponse {
  common.v1.BaseResponse base = 1;
  PpcShift data = 2;
}

message GetPpcShiftRequest {
  int64 shift_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetPpcShiftResponse {
  common.v1.BaseResponse base = 1;
  PpcShift data = 2;
}

message UpdatePpcShiftRequest {
  int64 shift_id = 1 [(buf.validate.field).int64.gt = 0];
  optional string name = 2 [(buf.validate.field).string.max_len = 40];
  optional string start_time = 3 [(buf.validate.field).string.pattern = "^([01][0-9]|2[0-3]):[0-5][0-9]$"];
  optional string end_time = 4 [(buf.validate.field).string.pattern = "^([01][0-9]|2[0-3]):[0-5][0-9]$"];
  optional bool is_active = 5;
}

message UpdatePpcShiftResponse {
  common.v1.BaseResponse base = 1;
  PpcShift data = 2;
}

message DeletePpcShiftRequest {
  int64 shift_id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeletePpcShiftResponse {
  common.v1.BaseResponse base = 1;
}

message ListPpcShiftsRequest {
  int32 page = 1 [(buf.validate.field).int32.gte = 1];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  ActiveFilter active_filter = 3;
}

message ListPpcShiftsResponse {
  common.v1.BaseResponse base = 1;
  repeated PpcShift data = 2;
  common.v1.PaginationResponse pagination = 3;
}
