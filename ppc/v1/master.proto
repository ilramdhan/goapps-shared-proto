  common.v1.PaginationResponse pagination = 3;
}

// ── OverrunThresholdConfig ───────────────────────────────────────────────────

// OverrunThresholdConfig is a 5-level over-production threshold. Resolution is
// most-specific-wins: WO -> PRODUCT -> PRODUCT_TYPE -> MACHINE_GROUP -> SYSTEM.
message OverrunThresholdConfig {
  int64 threshold_id = 1;
  ThresholdLevel level = 2;
  int64 ref_id = 3; // scoped id per level (0 for SYSTEM)
  ThresholdUnit threshold_unit = 4;
  string warning_value = 5; // decimal-as-string
  string block_value = 6; // decimal-as-string
  string notes = 7;
  bool is_active = 8;
  common.v1.AuditInfo audit = 16;
}

message CreateOverrunThresholdConfigRequest {
  ThresholdLevel level = 1 [(buf.validate.field).enum = {
    not_in: [0]
  }];
  optional int64 ref_id = 2 [(buf.validate.field).int64.gt = 0];
  ThresholdUnit threshold_unit = 3 [(buf.validate.field).enum = {
    not_in: [0]
  }];
  string warning_value = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 20
  }];
  string block_value = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 20
  }];
  string notes = 6 [(buf.validate.field).string.max_len = 500];
}

message CreateOverrunThresholdConfigResponse {
  common.v1.BaseResponse base = 1;
  OverrunThresholdConfig data = 2;
}

message GetOverrunThresholdConfigRequest {
  int64 threshold_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetOverrunThresholdConfigResponse {
  common.v1.BaseResponse base = 1;
  OverrunThresholdConfig data = 2;
}

