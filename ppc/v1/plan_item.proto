syntax = "proto3";

package ppc.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";
import "ppc/v1/common.proto";

// =============================================================================
// Layer 2 — Production Plan Item (the living monthly plan) + Gantt view.
// A plan item derives from a demand (FG) or a parent item (intermediate).
// Decimals are decimal-as-string.
// =============================================================================

// PlanItem is one Layer-2 planning row.
message PlanItem {
  int64 plan_item_id = 1;
  int64 cpm_product_sys_id = 2; // soft ref
  string product_code = 3; // denormalized for UI
  string product_name = 4; // denormalized for UI
  PlanItemType type = 5;
  int64 demand_id = 6; // set for FG items
  int64 parent_item_id = 7; // set for intermediate items
  string qty_target = 8; // decimal-as-string
  string deadline = 9; // ISO-8601 date
  RMSource rm_source = 10;
  int32 sequence = 11;
  PlanItemStatus status = 12;
  int64 machine_group_id = 13;
  int64 preferred_machine_id = 14;
  string month = 15; // YYYY-MM, derived from deadline
  string notes = 17;
  common.v1.AuditInfo audit = 16;
  string planned_start_date = 18; // ISO-8601 date, empty when not scheduled
  int32 planned_duration_days = 19; // 0 when not scheduled
  string duration_source = 20; // DERIVED | MANUAL
  // Shade (colour) of the route product at this level. Natural at upstream
  // levels, which is what makes those items mergeable into one work order.
  string shade_code = 21;
  string shade_name = 22;
  // Source plan item this one was carried forward from, 0 when it was not.
  // A new row per carry (never a month reassignment) is what keeps the source
  // month's plan an accurate record of what was committed there.
  int64 carry_from_item_id = 23;
  // The action that produced this item, when it came from a carry-forward.
  PlanCarryAction carry_action = 24;
}

// ── Carry-forward (month start) ──────────────────────────────────────────────
//
// Modelled on the demand pair (demand.proto) so the vocabulary stays the same,
// but with the narrower PlanCarryAction — see ppc/v1/common.proto for why.

// PlanCarryCandidate is one plan item eligible to be carried into a new month,
// decorated with everything the planner needs to decide without seeing an id.
message PlanCarryCandidate {
  PlanItem item = 1;
  // Qty on this item not yet committed to any work order:
  // qty_target - SUM(wo_plan_item_link.qty_contribution). This is what
  // CARRY_AS_IS carries, so a plan item already half-covered by a work order
  // does not get carried twice.
  string qty_uncovered = 2;
  // Qty already covered by work orders, for context alongside qty_uncovered.
  string qty_covered = 3;
  // How many work orders reference this plan item. Non-zero means the work is
  // already in flight and the work-order carry scope may also apply to it.
  int32 work_order_count = 4;
  // True when a plan item in the target month already names this one as its
  // carry source — a second run shows it as done rather than duplicating it.
  bool already_carried = 5;
  // Human label of the demand this item serves, for traceability. Empty for a
  // cascade INTERMEDIATE item, which serves a parent item rather than a demand.
  string demand_label = 6;
}

message ListPlanCarryForwardCandidatesRequest {
  string source_month = 1 [(buf.validate.field).string = {
    len: 7
    pattern: "^[0-9]{4}-[0-9]{2}$"
  }];
  // Target month the candidates are being carried into. Required: whether a
  // candidate is `already_carried` can only be answered against a target.
  string target_month = 2 [(buf.validate.field).string = {
    len: 7
    pattern: "^[0-9]{4}-[0-9]{2}$"
  }];
}

message ListPlanCarryForwardCandidatesResponse {
  common.v1.BaseResponse base = 1;
  repeated PlanCarryCandidate data = 2;
}

message ProcessPlanCarryForwardRequest {
  int64 source_plan_item_id = 1 [(buf.validate.field).int64.gt = 0];
  PlanCarryAction action = 2 [(buf.validate.field).enum = {
    not_in: [0]
  }];
  string target_month = 3 [(buf.validate.field).string = {
    len: 7
    pattern: "^[0-9]{4}-[0-9]{2}$"
  }];
  // New deadline for CARRY_AS_IS / PARTIAL_CARRY. Defaults to the source
  // deadline when omitted.
  optional string new_deadline = 4 [(buf.validate.field).string.max_len = 10];
  // Carried qty for PARTIAL_CARRY. Must not exceed the candidate's
  // qty_uncovered.
  optional string carry_qty = 5 [(buf.validate.field).string.max_len = 20];
}

message ProcessPlanCarryForwardResponse {
  common.v1.BaseResponse base = 1;
  // The plan item created in the target month. Absent for CANCEL, which
  // creates nothing.
  PlanItem data = 2;
}

message CreatePlanItemRequest {
  int64 cpm_product_sys_id = 1 [(buf.validate.field).int64.gt = 0];
  PlanItemType type = 2 [(buf.validate.field).enum = {
    not_in: [0]
  }];
  // Exactly one of demand_id / parent_item_id is expected (validated in app).
  optional int64 demand_id = 3 [(buf.validate.field).int64.gt = 0];
  optional int64 parent_item_id = 4 [(buf.validate.field).int64.gt = 0];
  string qty_target = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 20
  }];
  string deadline = 6 [(buf.validate.field).string = {
    min_len: 8
    max_len: 10
  }];
  optional RMSource rm_source = 7 [(buf.validate.field).enum = {
    not_in: [0]
  }];
  int64 machine_group_id = 8 [(buf.validate.field).int64.gt = 0];
  optional int64 preferred_machine_id = 9 [(buf.validate.field).int64.gt = 0];
  // Derived from deadline unless month_override is set (carry-forward only).
  optional string month = 10 [(buf.validate.field).string = {
    len: 7
    pattern: "^[0-9]{4}-[0-9]{2}$"
  }];
  optional string notes = 11 [(buf.validate.field).string.max_len = 2000];
  // Optional planner-supplied timeline. Setting either marks the item MANUAL;
  // omitting both leaves the duration system-derived from qty/capacity.
  optional string planned_start_date = 12 [(buf.validate.field).string.max_len = 10];
  optional int32 planned_duration_days = 13 [(buf.validate.field).int32 = {
    gte: 1
    lte: 60
  }];
  // Allows month to diverge from the deadline (carry-forward remainder).
  bool month_override = 14;
}

message CreatePlanItemResponse {
  common.v1.BaseResponse base = 1;
  PlanItem data = 2;
  // Deprecated: use `children` instead. Kept populated with `children[0]` for
  // one release so clients built against the single-child cascade keep working
  // during a rolling deploy.
  PlanItem child_data = 3 [deprecated = true];
  // Every cascade-generated upstream INTERMEDIATE plan item, ordered by
  // increasing route level (closest to the FG first). Empty when the product
  // has no released route, in which case `cascade_warning` explains why.
  repeated PlanItem children = 4;
  // Explains a save that legitimately succeeded but generated no upstream
  // items — most often a product whose route is still DRAFT rather than
  // COMPLETE/LOCKED. Empty when the cascade ran normally. A dedicated field,
  // not a suffix on base.message, so the client never has to parse prose.
  string cascade_warning = 5;
}

message GetPlanItemRequest {
  int64 plan_item_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetPlanItemResponse {
  common.v1.BaseResponse base = 1;
  PlanItem data = 2;
}

// Update edits mutable fields; changes are recorded in production_plan_log.
message UpdatePlanItemRequest {
  int64 plan_item_id = 1 [(buf.validate.field).int64.gt = 0];
  optional string qty_target = 2 [(buf.validate.field).string.max_len = 20];
  optional string deadline = 3 [(buf.validate.field).string.max_len = 10];
  optional RMSource rm_source = 4 [(buf.validate.field).enum = {
    not_in: [0]
  }];
  optional int32 sequence = 5 [(buf.validate.field).int32.gte = 0];
  optional PlanItemStatus status = 6 [(buf.validate.field).enum = {
    not_in: [0]
  }];
  optional int64 machine_group_id = 7 [(buf.validate.field).int64.gt = 0];
  optional int64 preferred_machine_id = 8 [(buf.validate.field).int64.gt = 0];
  optional string notes = 9 [(buf.validate.field).string.max_len = 2000];
  // Reason recorded in the plan-change log (required for material edits).
  optional string change_reason = 10 [(buf.validate.field).string.max_len = 500];
  // Setting either timeline field marks the item MANUAL; omitting both leaves
  // the existing duration source untouched.
  optional string planned_start_date = 11 [(buf.validate.field).string.max_len = 10];
  optional int32 planned_duration_days = 12 [(buf.validate.field).int32 = {
    gte: 1
    lte: 60
  }];
}

message UpdatePlanItemResponse {
  common.v1.BaseResponse base = 1;
  PlanItem data = 2;
}

message DeletePlanItemRequest {
  int64 plan_item_id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeletePlanItemResponse {
  common.v1.BaseResponse base = 1;
}

message ListPlanItemsRequest {
  int32 page = 1 [(buf.validate.field).int32.gte = 1];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  string search = 3 [(buf.validate.field).string.max_len = 100];
  string month = 4 [(buf.validate.field).string.max_len = 7];
  PlanItemType type = 5; // UNSPECIFIED = no filter.
  PlanItemStatus status = 6; // UNSPECIFIED = no filter.
  optional int64 machine_group_id = 7;
  optional int64 demand_id = 8;
  string sort_by = 9 [(buf.validate.field).string = {
    in: [
      "",
      "deadline",
      "product_code",
      "sequence",
      "status",
      "created_at"
    ]
  }];
  string sort_order = 10 [(buf.validate.field).string = {
    in: [
      "",
      "asc",
      "desc"
    ]
  }];
}

message ListPlanItemsResponse {
  common.v1.BaseResponse base = 1;
  repeated PlanItem data = 2;
  common.v1.PaginationResponse pagination = 3;
}

// ── Gantt view ───────────────────────────────────────────────────────────────

// GanttBar is one scheduled bar on the plan timeline (Y=machine, X=days).
message GanttBar {
  int64 plan_item_id = 1;
  int64 wo_id = 2; // 0 if not yet scheduled to a WO
  int64 machine_id = 3;
  string machine_no = 4;
  AreaCode area = 5;
  int64 machine_group_id = 6;
  string product_code = 7;
  string product_name = 8;
  PlanItemType type = 9;
  string qty_target = 10; // decimal-as-string
  string start_date = 11; // ISO-8601 date
  string end_date = 12; // ISO-8601 date
  PlanItemStatus status = 13;
  // True when this bar represents a changeover slot (red-dashed).
  bool is_changeover = 14;
  string lot_no = 15;
}

message GetGanttViewRequest {
  string month = 1 [(buf.validate.field).string = {
    len: 7
    pattern: "^[0-9]{4}-[0-9]{2}$"
  }];
  AreaCode area = 2; // UNSPECIFIED = all areas.
  optional int64 machine_group_id = 3;
  // Optional explicit window (defaults to the whole month).
  optional string from_date = 4 [(buf.validate.field).string.max_len = 10];
  optional string to_date = 5 [(buf.validate.field).string.max_len = 10];
}

message GetGanttViewResponse {
  common.v1.BaseResponse base = 1;
  repeated GanttBar data = 2;
}
